<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A way to Mim — Mohammad Siahbalaei</title>

  <style>
    :root {
      --bg: #04060b;
      --bg-soft: #080b13;
      --text: #f4f6ff;
      --muted: #7d8496;
      --line: rgba(255,255,255,.08);
      --accent: #91a4ff;
      --accent-soft: rgba(145,164,255,.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .space {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(72,91,170,.10), transparent 28%),
        radial-gradient(circle at 15% 20%, rgba(87,65,160,.07), transparent 25%),
        #04060b;
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: .65;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.75) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1px);
      background-size: 110px 110px, 180px 180px;
      background-position: 10px 20px, 80px 60px;
    }

    .nebula {
      position: absolute;
      width: 65vw;
      height: 65vw;
      max-width: 900px;
      max-height: 900px;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(105,126,255,.08),
        rgba(70,75,150,.035) 35%,
        transparent 70%
      );
      filter: blur(35px);
    }

    .nebula-two {
      position: absolute;
      width: 45vw;
      height: 45vw;
      right: -15%;
      top: -15%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(110,80,190,.06), transparent 70%);
      filter: blur(40px);
    }

    .shooting-star {
      position: absolute;
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
      transform: rotate(-28deg);
      top: 25%;
      left: 18%;
      opacity: .35;
    }

    .container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 42px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ef0c2;
      box-shadow: 0 0 12px rgba(158,240,194,.7);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 40px;
      padding: 40px 0 100px;
    }

    .hero {
      max-width: 600px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(52px, 8vw, 108px);
      line-height: .92;
      letter-spacing: -.065em;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
      letter-spacing: .04em;
      margin-bottom: 34px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
      padding: 12px 17px;
      border-radius: 999px;
      color: #dce1f2;
      font-size: 13px;
      transition: .25s ease;
    }

    .button:hover {
      border-color: rgba(145,164,255,.4);
      background: var(--accent-soft);
      transform: translateY(-2px);
    }

    .button.primary {
      border-color: rgba(145,164,255,.3);
      background: var(--accent-soft);
      color: #e8ecff;
    }

    .cosmic-visual {
      position: relative;
      width: min(520px, 45vw);
      aspect-ratio: 1;
      margin: auto;
      display: grid;
      place-items: center;
    }

    .deep-field {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120,140,255,.09), transparent 65%);
      filter: blur(8px);
    }

    .orbital-system {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .orbit {
      position: absolute;
      border: 1px solid rgba(145,164,255,.12);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    .orbit.one {
      width: 54%;
      height: 54%;
    }

    .orbit.two {
      width: 76%;
      height: 38%;
      transform: rotate(35deg);
    }

    .orbit.three {
      width: 88%;
      height: 58%;
      transform: rotate(-52deg);
    }

    .energy-ring {
      position: absolute;
      width: 42%;
      height: 42%;
      border-radius: 50%;
      border: 1px solid rgba(145,164,255,.32);
      box-shadow:
        0 0 35px rgba(112,130,255,.12),
        inset 0 0 25px rgba(112,130,255,.08);
    }

    .core {
      position: relative;
      width: 22%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #ffffff, #b9c5ff 14%, #687de8 38%, #29366e 68%, transparent 72%);
      box-shadow:
        0 0 25px rgba(145,164,255,.7),
        0 0 80px rgba(91,112,255,.3);
    }

    .core::after {
      content: "";
      position: absolute;
      inset: 35%;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 20px white;
    }

    .signal {
      position: absolute;
      width: 18%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(145,164,255,.65), transparent);
    }

    .signal.s1 {
      top: 28%;
      left: 12%;
      transform: rotate(18deg);
    }

    .signal.s2 {
      bottom: 25%;
      right: 8%;
      transform: rotate(-25deg);
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #dbe1ff;
      box-shadow: 0 0 12px rgba(180,195,255,.9);
    }

    .p1 { top: 17%; left: 38%; }
    .p2 { top: 34%; right: 12%; width: 3px; height: 3px; }
    .p3 { bottom: 18%; left: 28%; width: 3px; height: 3px; }
    .p4 { bottom: 30%; right: 23%; }
    .p5 { top: 48%; left: 8%; width: 3px; height: 3px; }
    .p6 { top: 12%; right: 30%; width: 3px; height: 3px; }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px;
      border: 1px solid var(--line);
      background: rgba(4,6,11,.78);
      backdrop-filter: blur(16px);
      border-radius: 999px;
    }

    .bottom-nav a {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
      padding: 9px 13px;
      border-radius: 999px;
      transition: .2s ease;
      white-space: nowrap;
    }

    .bottom-nav a:hover,
    .bottom-nav a.active {
      color: var(--text);
      background: rgba(255,255,255,.06);
    }

    @media (max-width: 800px) {
      .container {
        padding: 24px;
      }

      main {
        grid-template-columns: 1fr;
        text-align: center;
        padding-top: 70px;
      }

      .hero {
        margin: auto;
      }

      .actions {
        justify-content: center;
      }

      .cosmic-visual {
        width: min(400px, 82vw);
      }

      .bottom-nav {
        max-width: calc(100vw - 20px);
        overflow-x: auto;
      }

      .bottom-nav a {
        padding: 9px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="space">
    <div class="stars"></div>
    <div class="nebula"></div>
    <div class="nebula-two"></div>
    <div class="shooting-star"></div>
  </div>

  <div class="container">

    <header>
      <a href="index.html" class="brand">A way to Mim</a>

      <div class="status">
        <span class="status-dot"></span>
        In Space
      </div>
    </header>

    <main>

      <section class="hero">
        <div class="eyebrow">Mission 01 — Exploring the Unknown</div>

        <h1>Mohammad<br>Siahbalaei</h1>

        <p class="subtitle">R&amp;D · Learning · Exploration</p>

        <div class="actions">
          <a class="button primary" href="about.html">
            Explore profile →
          </a>

          <a class="button" href="contact.html">
            Contact
          </a>
        </div>
      </section>

      <section class="cosmic-visual" aria-hidden="true">
        <div class="deep-field"></div>

        <div class="orbital-system">
          <div class="orbit one"></div>
          <div class="orbit two"></div>
          <div class="orbit three"></div>

          <div class="energy-ring"></div>
          <div class="core"></div>

          <div class="signal s1"></div>
          <div class="signal s2"></div>

          <div class="particle p1"></div>
          <div class="particle p2"></div>
          <div class="particle p3"></div>
          <div class="particle p4"></div>
          <div class="particle p5"></div>
          <div class="particle p6"></div>
        </div>
      </section>

    </main>

  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="active">00 Mission Control</a>
    <a href="about.html">01 About</a>
    <a href="projects.html">02 Projects</a>
    <a href="contact.html">04 Contact</a>
  </nav>

</body>
</html>
